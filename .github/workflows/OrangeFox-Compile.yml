name: OrangeFox - Build

# Credits to:
# https://github.com/TeamWin
# https://gitlab.com/OrangeFox
# https://github.com/azwhikaru for Recovery Builder Template
# https://github.com/aditya-dumps/Actions-Build-OrangeFox

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'OrangeFox Manifest Branch'
        required: true
        default: '14.1'
        type: choice
        options:
        - 12.1
        - 14.1
      DEVICE_TREE:
        description: 'OrangeFox Device Tree URL'
        required: true
        default: 'https://github.com/aditya-dumps/android_device_lava_LXX516.git'
        type: string
      DEVICE_TREE_BRANCH:
        description: 'OrangeFox Device Tree Branch'
        required: true
        default: 'fox-14.1'
        type: string
      DEVICE_PATH:
        description: 'Specify your Device Path (e.g. device/lava/LXX516)'
        required: true
        default: 'device/lava/LXX516'
        type: string
      DEVICE_NAME:
        description: 'Specify your Device Codename (e.g. LXX516)'
        required: true
        default: 'LXX516'
        type: string
      RELEASE_TYPE:
        description: 'Specify your Release Type'
        required: true
        default: 'Debug'
        type: choice
        options:
        - Release
        - Debug
      BUILD_TYPE:
        description: 'Specify your Build Type'
        required: true
        default: 'eng'
        type: choice
        options:
        - user
        - userdebug
        - eng
      BUILD_TARGET:
        description: 'Specify your Build Target'
        required: true
        default: 'vendorboot'
        type: choice
        options:
        - boot
        - recovery
        - vendorboot

jobs:
  build:
    name: Build OFR by ${{ github.actor }}
    runs-on: ubuntu-22.04
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Clean-up Disk Space
      run: |
        sudo docker image prune -a -f || true
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache
        df -h

    - name: Set up 16GB Memory (zRAM / Fast Swap)
      run: |
        sudo swapoff -a || true
        # Attempt to install extra kernel modules containing zram for Azure runner
        sudo apt-get update && sudo apt-get install -y linux-modules-extra-$(uname -r) || true
        
        if sudo modprobe zram num_devices=1 2>/dev/null; then
          echo "zRAM module loaded successfully!"
          if grep -q zstd /sys/block/zram0/comp_algorithm 2>/dev/null; then
            echo zstd | sudo tee /sys/block/zram0/comp_algorithm
          fi
          echo 16G | sudo tee /sys/block/zram0/disksize
          sudo mkswap -L zram0 /dev/zram0
          sudo swapon -p 100 /dev/zram0
          sudo sysctl -w vm.swappiness=180
          echo "16GB zRAM active with max compression!"
        else
          echo "zRAM module unavailable in this cloud kernel; creating 16GB fast swap fallback..."
          sudo fallocate -l 16G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=16384
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          echo "16GB swap active!"
        fi
        free -h



    - name: Build Environment
      run: |
        sudo apt update
        sudo apt install -y aria2 rsync tar
        git clone https://gitlab.com/OrangeFox/misc/scripts.git -b master
        cd scripts
        sudo bash setup/android_build_env.sh

    - name: Set-up Manifest
      run: |
        mkdir -p ${GITHUB_WORKSPACE}/OrangeFox
        cd ${GITHUB_WORKSPACE}/OrangeFox
        git config --global user.name "${{ github.actor }}"
        git config --global user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
        git clone https://gitlab.com/OrangeFox/sync.git -b master
        cd sync
        ./orangefox_sync.sh --branch ${{ inputs.MANIFEST_BRANCH }} --path ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}

        cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}

        # Native Manifest Patching Fix (Correcting GitHub Runner environment)
        if [ -f .repo/manifests/remove-minimal.xml ]; then
          echo "Found remove-minimal.xml. Stripping blocks natively..."
          sed -i '/guava/d' .repo/manifests/remove-minimal.xml
          sed -i '/gflags/d' .repo/manifests/remove-minimal.xml
          echo "Manifest patched. Synchronizing official tree components..."
          repo sync -c --force-sync --no-clone-bundle --no-tags -j$(nproc --all) external/guava external/gflags || true
        else
          echo "remove-minimal.xml missing from track path. Syncing targets downstream..."
          repo sync -c --force-sync --no-clone-bundle --no-tags -j$(nproc --all) external/guava external/gflags || true
        fi

    - name: Clone Device Tree
      run: |
        cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}
        mkdir -p ./${{ inputs.DEVICE_PATH }}
        git clone ${{ inputs.DEVICE_TREE }} -b ${{ inputs.DEVICE_TREE_BRANCH }} ./${{ inputs.DEVICE_PATH }}
        cd ./${{ inputs.DEVICE_PATH }}
        echo "COMMIT_ID=$(git rev-parse HEAD)" >> $GITHUB_ENV

        # Apply Unisoc platform patches if present in device tree
        if [ -d patches ]; then
          echo "Applying hardware source patches..."
          cd patches && find . -type f -print0 | xargs -0 cp -f --parents -t ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}
          echo "Patches applied successfully."
        fi

        # Compatibility fix for Android 14.1 / ap2a platform release
        cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}
        if [ -f cts/tests/tests/os/assets/platform_releases.txt ]; then
          grep -q '^16\.1\.0$' cts/tests/tests/os/assets/platform_releases.txt || echo '16.1.0' >> cts/tests/tests/os/assets/platform_releases.txt
        fi

    - name: Building OrangeFox
      run: |
        cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}
        set +e
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        set -e

        if [ "${{ inputs.MANIFEST_BRANCH }}" = "12.1" ]; then
          echo "Building for 12.1"
          lunch twrp_${{ inputs.DEVICE_NAME }}-${{ inputs.BUILD_TYPE }} || lunch twrp_${{ inputs.DEVICE_NAME }}-eng
          make clean
          mka adbd ${{ inputs.BUILD_TARGET }}image -j$(nproc --all)
        fi

        if [ "${{ inputs.MANIFEST_BRANCH }}" = "14.1" ]; then
          echo "Building for 14.1"
          lunch twrp_${{ inputs.DEVICE_NAME }}-ap2a-${{ inputs.BUILD_TYPE }} || lunch twrp_${{ inputs.DEVICE_NAME }}-${{ inputs.BUILD_TYPE }} || lunch twrp_${{ inputs.DEVICE_NAME }}-eng
          make clean
          mka adbd ${{ inputs.BUILD_TARGET }}image -j$(nproc --all)
        fi

    - name: Set Release Properties
      run: |
        echo "BUILD_DATE=$(TZ=Asia/Kolkata date +%Y%m%d-%H%M)" >> $GITHUB_ENV
        cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}

        DEVICE_TREE_URL="${{ inputs.DEVICE_TREE }}"
        if [[ "${DEVICE_TREE_URL}" == *.git ]]; then
          DEVICE_TREE_URL="${DEVICE_TREE_URL%.git}"
        fi
        echo "DEVICE_TREE_URL=${DEVICE_TREE_URL}" >> $GITHUB_ENV

    - name: Upload to Release
      uses: softprops/action-gh-release@v2
      with:
        generate_release_notes: true
        files: |
          OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/out/target/product/${{ inputs.DEVICE_NAME }}/OrangeFox*.img
          OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/out/target/product/${{ inputs.DEVICE_NAME }}/OrangeFox*.zip
        name: OrangeFox Recovery for ${{ inputs.DEVICE_NAME }} // ${{ env.BUILD_DATE }}
        tag_name: ${{ github.run_id }}
        body: |
          ## OrangeFox Recovery Build - ${{ inputs.RELEASE_TYPE }}
          - **Build Manifest**: fox_${{ inputs.MANIFEST_BRANCH }}
          - **Device Tree**: [${{ inputs.DEVICE_NAME }}](${{ env.DEVICE_TREE_URL }}/tree/${{ inputs.DEVICE_TREE_BRANCH }})
          - **Commit**: [${{ env.COMMIT_ID }}](${{ env.DEVICE_TREE_URL }}/commit/${{ env.COMMIT_ID }})
